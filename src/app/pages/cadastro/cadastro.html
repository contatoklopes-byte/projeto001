<div class="login-container">
  <div class="login-box">
    <h2>Cadastro</h2>

    <form (ngSubmit)="register()">
      <div class="input-group">
        <label>Nome</label>
        <input type="text" placeholder="Digite seu nome" required [(ngModel)]="name" name="name">
      </div>

      <div class="input-group">
        <label>Email</label>
        <input type="email" placeholder="Digite seu email" required [(ngModel)]="email" name="email">
      </div>

      <div class="input-group">
        <label>Senha</label>
        <input type="password" placeholder="Digite sua senha" required [(ngModel)]="password" name="password">
      </div>

      <button type="submit">Cadastrar</button>

    </form>
  </div>
</div>

<div class="login-container">
  <div class="login-box">
    <h2>Login</h2>

    <form (ngSubmit)="loginUser()">
      <div class="input-group">
        <label>Email</label>
        <input type="email" placeholder="Digite seu email" required [(ngModel)]="email" name="email">
      </div>

      <div class="input-group">
        <label>Senha</label>
        <input type="password" placeholder="Digite sua senha" required [(ngModel)]="password" name="password">
      </div>

      <button type="submit">Entrar</button>

      <button type="button" class="admin-btn" (click)="loginAsAdmin()">Entrar como Admin</button>

      <p class="register">
        Não tem conta? <a routerLink="/cadastro">Cadastre-se</a>
      </p>
    </form>
  </div>
</div>

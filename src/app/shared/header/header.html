<!DOCTYPE html>
<html lang="br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <header class="header">
  <div class="logo">
    <h2><a routerLink="/home">VISTA Marketplace</a></h2>
  </div>

  <nav class="nav">
    <a routerLink="/home">Home</a>
    <a routerLink="/carrinho" *ngIf="authService.estaLogado()" class="carrinho-link" aria-label="Carrinho">
      <svg class="cart-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="9" cy="21" r="1"></circle>
        <circle cx="20" cy="21" r="1"></circle>
        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
      </svg>
      <span class="badge">{{ carrinhoService.totalQuantidade() }}</span>
    </a>
    <a *ngIf="authService.estaLogado()" routerLink="/perfil" class="user-info" title="Meu perfil">
      {{ authService.obterUsuarioLogado()?.nome }}
    </a>
    <a *ngIf="!authService.estaLogado()" routerLink="/login">Login</a>
    <a *ngIf="!authService.estaLogado()" routerLink="/cadastro">Cadastro</a>
    <a *ngIf="authService.estaLogado()" (click)="logout()" class="logout-btn">Sair</a>
</nav>

</header>

</body>
</html>
